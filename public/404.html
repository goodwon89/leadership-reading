<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>페이지를 찾을 수 없어요 · 리더십 2년차 독서교육</title>
<script>
  // GitHub Pages: 잘못된 주소로 들어오면 사이트 첫 화면(로그인)으로 이동
  (function () {
    var seg = location.pathname.split("/").filter(Boolean);
    var base = location.hostname.endsWith("github.io") && seg.length ? "/" + seg[0] + "/" : "/";
    location.replace(base + "#/login");
  })();
</script>
<style>body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#FAFAF9;color:#1C1917;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#00807F}</style>
</head><body><p>잠시 후 첫 화면으로 이동합니다. 이동하지 않으면 <a href="./">여기</a>를 눌러 주세요.</p></body></html>
